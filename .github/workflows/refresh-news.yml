# Rebuilds the site once a day so new Facebook posts appear in the News section.
# Needs the repository secret VERCEL_DEPLOY_HOOK (README, "Facebook news").
name: Refresh Facebook news

on:
  schedule:
    - cron: "17 13 * * *" # every day at 13:17 UTC = 6:17 Calgary (MST)
  workflow_dispatch: # "Run workflow" button for an instant refresh

# The job only calls a URL: it needs no access to the repository itself.
permissions: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger a Vercel rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        # Fails loudly when the secret is missing: a green run that does
        # nothing would hide that new Facebook posts never reach the site.
        # GitHub emails the repository owner about failed scheduled runs.
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set, so the site is never rebuilt and new Facebook posts don't appear. Add it as described in README, \"Facebook news\", step 6."
            exit 1
          fi
          curl -fsS --retry 3 -X POST "$HOOK" > /dev/null
          echo "Rebuild triggered: new Facebook posts appear in a few minutes."
